name: PlatformIO Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Firmware builds must not need repository secrets or write permissions.
permissions:
  contents: read

jobs:
  build:
    name: Build ESP32-S3 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Prepare placeholder credentials for build only
        run: cp include/secrets.example.h include/secrets.h

      - name: Build firmware (no hardware upload)
        run: pio run -e esp32s3
