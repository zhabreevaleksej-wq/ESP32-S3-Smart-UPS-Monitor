; ESP32-S3 N16R8 | UPS Monitor v3.2
[env:esp32s3]
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_port = COM3
lib_deps = adafruit/Adafruit INA219 @ ^1.2.3

; Actual module: 16 MB QIO flash + 8 MB OPI PSRAM
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

; FIRST UPLOAD (required after partition layout change): USB
upload_protocol = espota
upload_port = 192.168.0.103
extra_scripts = pre:ota_upload.py
; AFTER USB FLASH, switch by commenting the two lines above
; and uncommenting the following three lines:
; upload_protocol = espota
; upload_port = 192.168.0.103
; upload_flags = --auth=CHANGE_TO_STRONG_OTA_PASSWORD
