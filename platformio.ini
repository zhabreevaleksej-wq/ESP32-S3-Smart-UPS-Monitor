
; ESP32-S3 N16R8 | Smart UPS Monitor
; PlatformIO configuration

[env:esp32s3]
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino

; Serial monitor
monitor_speed = 115200
monitor_port = COM3

; Libraries
lib_deps = adafruit/Adafruit INA219 @ ^1.2.3

; Memory configuration: 16 MB QIO flash + 8 MB OPI PSRAM
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

; Custom partition layout
; USB upload required after partition layout changes
board_build.partitions = partitions.csv

; Wi-Fi OTA upload
; OTA password is handled by ota_upload.py
upload_protocol = espota
upload_port = 192.168.0.103
extra_scripts = pre:ota_upload.py
